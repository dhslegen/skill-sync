# 发布构建:打 v* tag 触发,双平台出安装包(M1 任务 13;M8 起真实启用,主要为 Windows)。
#
# 与 ci.yml 同一假设:语法兼容内网 Gitea Actions,迁移时只需调整 runs-on 与 secrets。
#
# 编译期内网配置从 secrets 注入。2026-08-07 用户拍板调整了保密边界:
# **内网地址/仓库坐标/公钥可以进公开 CI**(产物 artifact 任何人可下载,可接受),
# 但**真秘密——minisign 私钥、任何 token/密码——绝不配进公开仓 secrets**。
# 因此 TAURI_SIGNING_PRIVATE_KEY 不在 guard 的必需名单里:CI 产物不带 .sig,
# Windows 包的 .sig 由本地机器 `pnpm tauri signer sign` 离线补签(私钥永不离开本地)。
#
# secrets 未配置时 workflow 直接失败——绝不发出"连不上公司技能库"的空壳包,
# 这与 scripts/build-release.sh 的本地拦截是同一道闸的两个入口。
#
# macOS 签名/公证:正式 macOS 发布走本地 publish-release.sh(证书在本地钥匙串);
# 此处 APPLE_* secrets 未配置时产出未签名包,仅供内部测试机——不要发给普通同事。
name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: 校验内网配置 secrets 齐备
        env:
          URL: ${{ secrets.SKILLSYNC_BUILTIN_GITEA_URL }}
          CID: ${{ secrets.SKILLSYNC_OAUTH_CLIENT_ID }}
          REPO: ${{ secrets.SKILLSYNC_BUILTIN_REPO }}
          BRANCH: ${{ secrets.SKILLSYNC_BUILTIN_BRANCH }}
          UPDATE_URL: ${{ secrets.SKILLSYNC_UPDATE_URL }}
          UPDATE_PUBKEY: ${{ secrets.SKILLSYNC_UPDATE_PUBKEY }}
        run: |
          fail=0
          for pair in "SKILLSYNC_BUILTIN_GITEA_URL=$URL" "SKILLSYNC_OAUTH_CLIENT_ID=$CID" \
                      "SKILLSYNC_BUILTIN_REPO=$REPO" "SKILLSYNC_BUILTIN_BRANCH=$BRANCH"; do
            name="${pair%%=*}"; value="${pair#*=}"
            if [ -z "$value" ]; then
              echo "::error::缺少 secret $name —— 构建出的包连不上公司技能库,拒绝发布"
              fail=1
            fi
          done
          # App 自更新:缺更新源/公钥,发布出去的包永远收不到更新。
          # TAURI_SIGNING_PRIVATE_KEY **故意不在必需名单**(2026-08-07 拍板):
          # 真秘密绝不配进公开仓 secrets,.sig 由本地离线补签——别把它加回来。
          for pair in "SKILLSYNC_UPDATE_URL=$UPDATE_URL" "SKILLSYNC_UPDATE_PUBKEY=$UPDATE_PUBKEY"; do
            name="${pair%%=*}"; value="${pair#*=}"
            if [ -z "$value" ]; then
              echo "::error::缺少 secret $name —— 发布出去的包永远收不到应用更新,拒绝发布"
              fail=1
            fi
          done
          exit $fail

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建安装包
        env:
          SKILLSYNC_BUILTIN_GITEA_URL: ${{ secrets.SKILLSYNC_BUILTIN_GITEA_URL }}
          SKILLSYNC_OAUTH_CLIENT_ID: ${{ secrets.SKILLSYNC_OAUTH_CLIENT_ID }}
          SKILLSYNC_BUILTIN_REPO: ${{ secrets.SKILLSYNC_BUILTIN_REPO }}
          SKILLSYNC_BUILTIN_BRANCH: ${{ secrets.SKILLSYNC_BUILTIN_BRANCH }}
          # 可选(M3):GitHub 一键登录的 Client ID;secret 未配置时注入空值,
          # 不拦构建——GitHub 源仍可匿名浏览获取,仅登录报"未配置"
          SKILLSYNC_GITHUB_CLIENT_ID: ${{ secrets.SKILLSYNC_GITHUB_CLIENT_ID }}
          # App 自更新:更新源与公钥编译进包;私钥给产物出 .sig(M2 任务 5)
          SKILLSYNC_UPDATE_URL: ${{ secrets.SKILLSYNC_UPDATE_URL }}
          SKILLSYNC_UPDATE_PUBKEY: ${{ secrets.SKILLSYNC_UPDATE_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS 签名与公证(证书到位后配置这四个 secrets 即自动生效)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # pubkey 必须在这里给:签名验证配置编译进包,tauri 读的是
        # plugins.updater.pubkey,而主 conf 里按铁律 5 只有空占位,
        # 空字符串会报 `failed to decode pubkey: Missing comment in public key`。
        # dangerousInsecureTransportProtocol:内网 Gitea 是 http,tauri updater 默认拒绝
        # 明文端点,不开它发布包永远收不到更新(2026-08-05 端到端实测抓到)。
        # createUpdaterArtifacts **只在签名私钥存在时开**:开了它、没私钥,构建直接失败,
        # 而私钥按 2026-08-07 拍板绝不进公开仓 secrets——公开 CI 上产物不带 .sig,
        # 由本地 `pnpm tauri signer sign` 离线补签(迁到内网 CI 配上私钥后自动恢复出 .sig)。
        # shell 必须显式 bash:Windows runner 默认 pwsh,下面的 $() 语法根本跑不了
        # ——secrets 未配置的年代 guard 一直拦着,这个 step 在 Windows 上从没真跑过。
        # overlay 用 node 拼(setup-node 保证双平台可用;python3 在 Windows 的 bash 里没保证)。
        shell: bash
        run: |
          # GitHub Actions 把未配置的 secret 展开成**空字符串**塞进 env,而 tauri 的
          # macOS 打包只要看到 APPLE_CERTIFICATE 这个变量存在(哪怕为空)就去导钥匙串,
          # 空值导入直接失败(`failed to import keychain certificate`)。guard 拦着的
          # 年代这个 step 从没跑过,2026-08-07 首跑才暴露——与 pwsh 那个坑同一类。
          # 对策:为空即 unset,让 tauri 走"未配置"分支(未签名包)。
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
                   TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then unset "$v"; fi
          done
          CONFIG_JSON="$(node -e 'const c={plugins:{updater:{pubkey:process.env.SKILLSYNC_UPDATE_PUBKEY,dangerousInsecureTransportProtocol:true}}};if(process.env.TAURI_SIGNING_PRIVATE_KEY)c.bundle={createUpdaterArtifacts:true};console.log(JSON.stringify(c))')"
          pnpm tauri build --config "$CONFIG_JSON"

      - name: 收集产物 (macOS)
        if: runner.os == 'macOS'
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          mkdir -p dist-release
          cp src-tauri/target/release/bundle/dmg/*.dmg dist-release/ 2>/dev/null || true
          # updater 工件:压缩的 .app + minisign 签名(latest.json 指向它们)
          cp src-tauri/target/release/bundle/macos/*.app.tar.gz dist-release/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/macos/*.app.tar.gz.sig dist-release/ 2>/dev/null || true
          if [ -z "$SIGNING_IDENTITY" ]; then
            for f in dist-release/*.dmg; do
              [ -e "$f" ] && mv "$f" "${f%.dmg}-unsigned.dmg"
            done
            echo "::warning::macOS 产物未签名,仅供内部测试机;正式分发需配置 APPLE_* secrets"
          fi

      - name: 收集产物 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist-release
          cp src-tauri/target/release/bundle/nsis/*.exe dist-release/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/msi/*.msi dist-release/ 2>/dev/null || true
          # updater 工件:NSIS 安装包的 minisign 签名(latest.json 指向 exe + sig)
          cp src-tauri/target/release/bundle/nsis/*.sig dist-release/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: skillsync-${{ runner.os }}
          path: dist-release/*
          if-no-files-found: error
