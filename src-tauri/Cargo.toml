[package]
name = "skillsync"
version = "0.1.0"
description = "企业内网 AI Skill 共享桌面客户端"
authors = ["zhaowenhao"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "skillsync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
# YAML(SKILL.md frontmatter)。serde_yaml 已于 2024 归档不再维护,saphyr 是同一维护者
# 从 yaml-rust2 延续下来的活跃分支。0.0.x 版本号意味着 cargo 会精确锁定,升级需人工过一遍 API。
# 所有 YAML 访问都收在 core::skills::frontmatter 一处,换库只影响该模块。
saphyr = "0.0.11"
base64 = "0.23.0"
zip = "8.6.0"
# rustls 而非系统 TLS:免去 OpenSSL 的构建依赖,双平台交叉构建一致。
# 内建 Gitea 走的是内网 http,TLS 只用于用户自定义的 https 源。
# system-proxy 保持 reqwest 默认行为(读系统代理设置,遵守 NO_PROXY),与企业环境预期一致。
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "rustls",
  "http2",
  "system-proxy",
] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"

