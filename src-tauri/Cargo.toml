[package]
name = "skillsync"
version = "0.4.0"
description = "企业内网 AI Skill 共享桌面客户端"
authors = ["zhaowenhao"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "skillsync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order:.skill-lock.json 是外部契约,双写时必须原样保住键序与我们不认识的字段。
# 缺了它 serde_json 用 BTreeMap,键会被重排成字母序——文件仍合法,但对 npx skills 是一次无谓的全量改写。
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "6"
# YAML(SKILL.md frontmatter)。serde_yaml 已于 2024 归档不再维护,saphyr 是同一维护者
# 从 yaml-rust2 延续下来的活跃分支。0.0.x 版本号意味着 cargo 会精确锁定,升级需人工过一遍 API。
# 所有 YAML 访问都收在 core::skills::frontmatter 一处,换库只影响该模块。
saphyr = "0.0.11"
base64 = "0.23.0"
zip = "8.6.0"
# rustls 而非系统 TLS:免去 OpenSSL 的构建依赖,双平台交叉构建一致。
# 内建 Gitea 走的是内网 http,TLS 只用于用户自定义的 https 源。
# system-proxy 保持 reqwest 默认行为(读系统代理设置,遵守 NO_PROXY),与企业环境预期一致。
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "rustls",
  "http2",
  "system-proxy",
  # 令牌端点按 OAuth2 规范收 application/x-www-form-urlencoded
  "form",
] }
sha2 = "0.11.0"
url = "2.5.8"
# keyring 默认不带任何平台后端,漏配会静默退化成内存存储——凭证根本进不了钥匙串,
# 且重启即失效。故按平台显式指定原生后端。
keyring = { version = "4.1.5", default-features = false, features = ["v1"] }
getrandom = "0.4.3"
# scheduler(M2 任务 3)需要 time(定时睡眠)与 sync(命令通道)
tokio = { version = "1.53.1", features = ["rt", "time", "sync", "macros"] }
# 日志:滚动文件落 ~/.skillsync/logs/,scheduler 后台运行的唯一可追溯通道
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
# 本地技能目录的文件监听(M4 任务 6c 级别 3)。关掉默认特性里的 crossbeam 通道,
# 我们用 std::sync::mpsc 就够;macos_fsevent 让 macOS 走 FSEvents 而不是轮询
# (轮询会周期性 stat 整棵目录树,对常驻应用是白烧电)。
# Windows 用 ReadDirectoryChangesW、Linux 用 inotify,都由 notify 按平台自选。
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.1.5", default-features = false, features = [
  "v1",
  "apple-native-keyring-store",
] }
# 后端还要再选一种 keychain 实现:keychain 是传统钥匙串,未签名的开发构建也能用;
# protected(数据保护钥匙串)要求应用已签名并带相应授权,不适合本地开发。
apple-native-keyring-store = { version = "1", default-features = false, features = [
  "keychain",
] }

[target.'cfg(target_os = "windows")'.dependencies]
# Windows 建链主路径。std 没有 junction API,而 junction 相比 symlink_dir 的决定性优势是
# **免管理员权限**(C11:首台机器 symlink 成功疑为提权假阳性)。该 crate 零第三方依赖树之外的负担,
# 且 delete 只摘除 reparse point、不触碰目标目录内容——正是"绝不静默删除用户文件"要的语义。
# 关掉 default features:unstable_admin 只服务于它自己的测试。
junction = { version = "2.0.0", default-features = false }
keyring = { version = "4.1.5", default-features = false, features = [
  "v1",
  "windows-native-keyring-store",
] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4.1.5", default-features = false, features = [
  "v1",
  "zbus-secret-service-keyring-store",
] }

# tests/keyring_windows.rs 要直接探一次分片条目(验证覆盖写不留孤儿),
# 而集成测试是独立 crate、够不到 [dependencies],故在 dev 侧再声明一次。
[target.'cfg(target_os = "windows")'.dev-dependencies]
keyring = { version = "4.1.5", default-features = false, features = [
  "v1",
  "windows-native-keyring-store",
] }

[dev-dependencies]
base64 = "0.23.0"
tempfile = "3.24.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "test-util"] }
toml = "1.1.4"
wiremock = "0.6.5"

