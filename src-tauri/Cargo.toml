[package]
name = "skillsync"
version = "0.1.0"
description = "企业内网 AI Skill 共享桌面客户端"
authors = ["zhaowenhao"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "skillsync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
# YAML(SKILL.md frontmatter)。serde_yaml 已于 2024 归档不再维护,saphyr 是同一维护者
# 从 yaml-rust2 延续下来的活跃分支。0.0.x 版本号意味着 cargo 会精确锁定,升级需人工过一遍 API。
# 所有 YAML 访问都收在 core::skills::frontmatter 一处,换库只影响该模块。
saphyr = "0.0.11"
base64 = "0.23.0"
zip = "8.6.0"
# rustls 而非系统 TLS:免去 OpenSSL 的构建依赖,双平台交叉构建一致。
# 内建 Gitea 走的是内网 http,TLS 只用于用户自定义的 https 源。
# system-proxy 保持 reqwest 默认行为(读系统代理设置,遵守 NO_PROXY),与企业环境预期一致。
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "rustls",
  "http2",
  "system-proxy",
  # 令牌端点按 OAuth2 规范收 application/x-www-form-urlencoded
  "form",
] }
sha2 = "0.11.0"
url = "2.5.8"
# keyring 默认不带任何平台后端,漏配会静默退化成内存存储——凭证根本进不了钥匙串,
# 且重启即失效。故按平台显式指定原生后端。
keyring = { version = "4.1.5", default-features = false, features = ["v1"] }
getrandom = "0.4.3"
tokio = { version = "1.53.1", features = ["rt"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.1.5", default-features = false, features = [
  "v1",
  "apple-native-keyring-store",
] }
# 后端还要再选一种 keychain 实现:keychain 是传统钥匙串,未签名的开发构建也能用;
# protected(数据保护钥匙串)要求应用已签名并带相应授权,不适合本地开发。
apple-native-keyring-store = { version = "1", default-features = false, features = [
  "keychain",
] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4.1.5", default-features = false, features = [
  "v1",
  "windows-native-keyring-store",
] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4.1.5", default-features = false, features = [
  "v1",
  "zbus-secret-service-keyring-store",
] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"

